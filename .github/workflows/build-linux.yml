name: Build Linux AppImage

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3. Install Flet CLI, PyInstaller and Pillow (for icon conversion)
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flet flet-cli pyinstaller pillow

      # 4. Create required directories and convert icon
      - name: Setup environment
        run: |
          mkdir -p app/assets
          # Create a simple icon if it doesn't exist
          python -c "from PIL import Image, ImageDraw, ImageFont; \
                     img = Image.new('RGB', (256, 256), (0, 120, 215)); \
                     d = ImageDraw.Draw(img); \
                     try: \
                         font = ImageFont.truetype('Arial', 120); \
                     except: \
                         font = ImageFont.load_default(); \
                     d.text((30, 60), 'CA', fill=(255, 255, 255), font=font); \
                     img.save('app/assets/icon.png')"

      # 5. Build Linux AppImage
      - name: Build AppImage
        run: |
          flet pack frontend/main.py \
            --name "Clarikey Analytics" \
            --icon app/assets/icon.png \
            --add-data "backend:backend" \
            --add-data "frontend:frontend" \
            --yes

      # 6. Upload AppImage as artifact
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Clarikey-AppImage
          path: dist/*