name: Build Linux AppImage

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli pyinstaller pillow

      # 4️⃣ Generate icon (optional)
      - name: Generate icon
        run: |
          python - <<EOF
          from PIL import Image, ImageDraw, ImageFont
          import os

          os.makedirs("app/assets", exist_ok=True)

          img = Image.new('RGB', (256, 256), (0, 120, 215))
          d = ImageDraw.Draw(img)
          try:
              font = ImageFont.truetype('Arial', 120)
          except:
              font = ImageFont.load_default()
          d.text((30, 60), 'CA', fill=(255, 255, 255), font=font)
          img.save('app/assets/icon.png')
          EOF

      # 5️⃣ Build Linux AppImage
      - name: Build AppImage
        run: |
          flet pack frontend/main.py \
            --name "Clarikey Analytics" \
            --icon app/assets/icon.png \
            --add-data "backend:backend" \
            --add-data "frontend:frontend" \
            --target linux \
            --yes

      # 6️⃣ Upload .AppImage artifact
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Clarikey-AppImage
          path: dist/*.AppImage
