name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3️⃣ Upgrade pip and install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli pyinstaller

      # 4️⃣ Build the macOS .app bundle
      - name: Build .app
        run: |
          flet pack main.py \
            --name "Clarikey Analytics" \
            --icon assets/icon.icns \
            --target macos \
            --add-data "app:app" \
            --yes

      # 5️⃣ Create a .dmg installer
      - name: Package .dmg
        run: |
          hdiutil create -volname "Clarikey Analytics" \
          -srcfolder dist/Clarikey\ Analytics.app \
          -ov -format UDZO ClarikeyAnalytics.dmg

      # 6️⃣ Upload artifacts
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-build
          path: |
            dist/Clarikey\ Analytics.app
            ClarikeyAnalytics.dmg
