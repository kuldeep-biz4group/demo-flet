name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3️⃣ Upgrade pip and install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli pyinstaller pillow

      # 4️⃣ Generate icon (if needed)
      - name: Generate icon
        run: |
          python - <<EOF
          from PIL import Image, ImageDraw, ImageFont
          import os

          os.makedirs("assets", exist_ok=True)

          img = Image.new('RGB', (256, 256), (0, 120, 215))
          d = ImageDraw.Draw(img)
          try:
              font = ImageFont.truetype('Arial', 120)
          except:
              font = ImageFont.load_default()
          d.text((30, 60), 'CA', fill=(255, 255, 255), font=font)
          img.save('assets/icon.icns')
          EOF

      # 5️⃣ Build the macOS .app bundle
      - name: Build .app
        run: |
          flet pack main.py \
            --name "Clarikey Analytics" \
            --icon assets/icon.icns \
            --add-data "app:app" \
            --yes

      # 6️⃣ Create a .dmg installer
      - name: Package .dmg
        run: |
          hdiutil create -volname "Clarikey Analytics" \
            -srcfolder dist/Clarikey\ Analytics.app \
            -ov -format UDZO ClarikeyAnalytics.dmg

      # 7️⃣ Upload artifacts
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-build
          path: |
            dist/Clarikey\ Analytics.app
            ClarikeyAnalytics.dmg
