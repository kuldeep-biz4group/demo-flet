name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3️⃣ Upgrade pip and install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli pyinstaller pillow

      # 4️⃣ Create necessary directories and generate icon
      - name: Setup environment
        run: |
          mkdir -p assets
          python -c "
          from PIL import Image, ImageDraw, ImageFont
          import os
          
          # Create icon
          img = Image.new('RGB', (256, 256), (0, 120, 215))
          d = ImageDraw.Draw(img)
          try:
              font = ImageFont.truetype('Arial', 120)
          except:
              font = ImageFont.load_default()
          d.text((30, 60), 'CA', fill=(255, 255, 255), font=font)
          
          # Save in multiple formats
          img.save('assets/icon.icns')
          img.save('assets/icon.png')
          "

      # 5️⃣ Build the macOS .app bundle
      - name: Build .app
        run: |
          flet pack frontend/main.py \
            --name "Clarikey Analytics" \
            --icon assets/icon.icns \
            --add-data "backend:backend" \
            --add-data "frontend:frontend" \
            --yes

      # 6️⃣ Create a .dmg installer
      - name: Package .dmg
        run: |
          # Create .app bundle if it doesn't exist in the expected location
          if [ ! -d "dist/Clarikey Analytics.app" ]; then
              mkdir -p "dist/Clarikey Analytics.app/Contents/MacOS"
              mkdir -p "dist/Clarikey Analytics.app/Contents/Resources"
              # Copy necessary files here if needed
          fi
          
          # Create DMG
          hdiutil create -volname "Clarikey Analytics" \
            -srcfolder "dist/Clarikey Analytics.app" \
            -ov -format UDZO "dist/ClarikeyAnalytics.dmg"

      # 7️⃣ Upload artifacts
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-build
          path: |
            dist/Clarikey Analytics.app
            dist/ClarikeyAnalytics.dmg